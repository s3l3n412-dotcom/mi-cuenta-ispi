<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mi Cuenta ISPI</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f8fb;
            color: #333;
            min-height: 100vh;
        }

        header {
            background: #5BC0DE;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 {
            font-size: 25px;
        }

        nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        nav button {
            border: none;
            background: white;
            color: #3AA8C8;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        nav button:hover {
            background: #e8f8fc;
        }

        .theme-button {
            background: #333;
            color: white;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .hero {
            text-align: center;
            padding: 50px 30px;
        }

        .hero i {
            font-size: 60px;
            color: #5BC0DE;
            margin-bottom: 20px;
        }

        h2 {
            color: #3AA8C8;
            margin-bottom: 20px;
        }

        h3 {
            color: #3AA8C8;
            margin-bottom: 15px;
        }

        p {
            line-height: 1.6;
        }

        form {
            max-width: 600px;
            margin: auto;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #5BC0DE;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #5BC0DE;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn:hover {
            background: #3AA8C8;
        }

        .btn-green {
            background: #8BC34A;
        }

        .btn-orange {
            background: #FF9800;
        }

        .message {
            padding: 14px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
        }

        .success {
            background: #e4f8df;
            color: #267314;
        }

        .loading {
            background: #e5f5fb;
            color: #16708f;
        }

        .student-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .info-box {
            background: #f2f8fb;
            padding: 18px;
            border-radius: 10px;
        }

        .info-box strong {
            display: block;
            color: #3AA8C8;
            margin-bottom: 5px;
        }

        .saldo {
            text-align: center;
            background: #fff3df;
            padding: 25px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .saldo strong {
            display: block;
            font-size: 32px;
            color: #FF9800;
            margin-top: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #5BC0DE;
            color: white;
        }

        .paid {
            color: #5b9b25;
            font-weight: bold;
        }

        .pending {
            color: #d87900;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        /* ==============================
           MODO OSCURO
        ============================== */

        body[data-theme="dark"] {
            background: #1e2930;
            color: #eee;
        }

        body[data-theme="dark"] .card {
            background: #29363d;
        }

        body[data-theme="dark"] .info-box {
            background: #35444c;
        }

        body[data-theme="dark"] input,
        body[data-theme="dark"] select {
            background: #35444c;
            color: white;
            border-color: #60727c;
        }

        body[data-theme="dark"] th {
            background: #3AA8C8;
        }

        body[data-theme="dark"] td {
            border-color: #50616a;
        }

        @media (max-width: 700px) {

            header {
                flex-direction: column;
            }

            nav {
                justify-content: center;
            }

            .card {
                padding: 20px;
            }

            table {
                font-size: 14px;
            }

            th,
            td {
                padding: 8px;
            }
        }

    </style>
</head>

<body>

<header>

    <h1>
        <i class="fa-solid fa-graduation-cap"></i>
        Mi Cuenta ISPI
    </h1>

    <nav>

        <button onclick="showSection('inicio')">
            <i class="fa-solid fa-house"></i>
            Inicio
        </button>

        <button onclick="showSection('login')">
            <i class="fa-solid fa-right-to-bracket"></i>
            Ingresar
        </button>

        <button onclick="showSection('registro')">
            <i class="fa-solid fa-user-plus"></i>
            Registrarse
        </button>

        <button
            class="theme-button"
            onclick="toggleTheme()"
        >
            <i class="fa-solid fa-moon"></i>
        </button>

    </nav>

</header>


<main>

    <!-- ==============================
         INICIO
    =============================== -->

    <section
        id="inicio"
        class="section active"
    >

        <div class="card hero">

            <i class="fa-solid fa-graduation-cap"></i>

            <h2>
                Bienvenido a Mi Cuenta ISPI
            </h2>

            <p>
                Consultá tus datos académicos,
                cuotas y estado de cuenta
                de manera sencilla.
            </p>

            <br>

            <button
                class="btn"
                onclick="showSection('login')"
            >
                Ingresar a mi cuenta
            </button>

        </div>

    </section>


    <!-- ==============================
         LOGIN
    =============================== -->

    <section
        id="login"
        class="section"
    >

        <div class="card">

            <h2>
                <i class="fa-solid fa-right-to-bracket"></i>
                Ingresar
            </h2>

            <form onsubmit="handleLogin(event)">

                <div class="form-group">

                    <label for="loginDni">
                        DNI
                    </label>

                    <input
                        type="text"
                        id="loginDni"
                        placeholder="Ingresá tu DNI"
                        maxlength="8"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="loginPassword">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Ingresá tu contraseña"
                        required
                    >

                </div>

                <div
                    id="loginLoading"
                    class="message loading"
                >
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    Buscando cuenta...
                </div>

                <div
                    id="loginError"
                    class="message error"
                ></div>

                <button
                    type="submit"
                    class="btn"
                    id="btnLogin"
                >
                    Ingresar
                </button>

            </form>

        </div>

    </section>


    <!-- ==============================
         REGISTRO
    =============================== -->

    <section
        id="registro"
        class="section"
    >

        <div class="card">

            <h2>
                <i class="fa-solid fa-user-plus"></i>
                Crear cuenta
            </h2>

            <form onsubmit="handleRegistro(event)">

                <!-- DNI -->

                <div class="form-group">

                    <label for="registroDni">
                        DNI
                    </label>

                    <input
                        type="text"
                        id="registroDni"
                        placeholder="Ejemplo: 44556677"
                        maxlength="8"
                        required
                    >

                </div>


                <!-- NOMBRE -->

                <div class="form-group">

                    <label for="registroNombre">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="registroNombre"
                        placeholder="Ingresá tu nombre"
                        required
                    >

                </div>


                <!-- APELLIDO -->

                <div class="form-group">

                    <label for="registroApellido">
                        Apellido
                    </label>

                    <input
                        type="text"
                        id="registroApellido"
                        placeholder="Ingresá tu apellido"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="registroEmail">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="registroEmail"
                        placeholder="ejemplo@gmail.com"
                        required
                    >

                </div>


                <!-- TELEFONO -->

                <div class="form-group">

                    <label for="registroTelefono">
                        Teléfono
                    </label>

                    <input
                        type="tel"
                        id="registroTelefono"
                        placeholder="Ejemplo: 3482 123456"
                        required
                    >

                </div>


                <!-- CARRERA -->

                <div class="form-group">

                    <label for="registroCarrera">
                        Carrera
                    </label>

                    <input
                        type="text"
                        id="registroCarrera"
                        placeholder="Ejemplo: Tecnicatura"
                        required
                    >

                </div>


                <!-- CURSO -->

                <div class="form-group">

                    <label for="registroCurso">
                        Curso
                    </label>

                    <select
                        id="registroCurso"
                        required
                    >

                        <option value="">
                            Seleccioná el curso
                        </option>

                        <option value="1">
                            1° año
                        </option>

                        <option value="2">
                            2° año
                        </option>

                        <option value="3">
                            3° año
                        </option>

                        <option value="4">
                            4° año
                        </option>

                    </select>

                </div>


                <!-- CONTRASEÑA -->

                <div class="form-group">

                    <label for="registroPassword">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="registroPassword"
                        placeholder="Ingresá una contraseña"
                        required
                    >

                </div>


                <!-- CONFIRMAR CONTRASEÑA -->

                <div class="form-group">

                    <label for="registroPassword2">
                        Confirmar contraseña
                    </label>

                    <input
                        type="password"
                        id="registroPassword2"
                        placeholder="Repetí la contraseña"
                        required
                    >

                </div>


                <div
                    id="registroLoading"
                    class="message loading"
                >
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    Registrando alumno...
                </div>


                <div
                    id="registroError"
                    class="message error"
                ></div>


                <div
                    id="registroExito"
                    class="message success"
                ></div>


                <button
                    type="submit"
                    class="btn btn-green"
                    id="btnRegistro"
                >
                    <i class="fa-solid fa-user-plus"></i>
                    Registrarme
                </button>

            </form>

        </div>

    </section>


    <!-- ==============================
         CUENTA
    =============================== -->

    <section
        id="cuenta"
        class="section"
    >

        <div class="card">

            <h2>
                <i class="fa-solid fa-user"></i>
                Mi cuenta
            </h2>

            <div
                id="datosAlumno"
                class="student-info"
            ></div>

        </div>


        <div class="card">

            <div class="saldo">

                <span>
                    Saldo pendiente
                </span>

                <strong id="saldo">
                    $0
                </strong>

            </div>

        </div>


        <div class="card">

            <h3>
                <i class="fa-solid fa-file-invoice-dollar"></i>
                Mis cuotas
            </h3>

            <div id="tablaCuotas"></div>

        </div>


        <div class="card">

            <button
                class="btn btn-orange"
                onclick="descargarResumen()"
            >
                <i class="fa-solid fa-download"></i>
                Descargar resumen
            </button>

        </div>

    </section>

</main>


<footer>

    Mi Cuenta ISPI - Sistema de gestión académica

</footer>


<script>

// ==========================================
// CAMBIAR SECCIÓN
// ==========================================

function showSection(nombre) {

    document
        .querySelectorAll(".section")
        .forEach(section => {
            section.classList.remove("active");
        });

    const section =
        document.getElementById(nombre);

    if (section) {
        section.classList.add("active");
    }

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


// ==========================================
// MODO OSCURO
// ==========================================

function toggleTheme() {

    const body = document.body;

    if (
        body.getAttribute("data-theme") === "dark"
    ) {

        body.removeAttribute("data-theme");

        localStorage.setItem(
            "tema",
            "claro"
        );

    } else {

        body.setAttribute(
            "data-theme",
            "dark"
        );

        localStorage.setItem(
            "tema",
            "oscuro"
        );
    }
}


// Cargar tema guardado

if (
    localStorage.getItem("tema") === "oscuro"
) {

    document.body.setAttribute(
        "data-theme",
        "dark"
    );
}


// ==========================================
// REGISTRO
// ==========================================

async function handleRegistro(event) {

    event.preventDefault();

    const dni =
        document
            .getElementById("registroDni")
            .value
            .trim();

    const nombre =
        document
            .getElementById("registroNombre")
            .value
            .trim();

    const apellido =
        document
            .getElementById("registroApellido")
            .value
            .trim();

    const email =
        document
            .getElementById("registroEmail")
            .value
            .trim();

    const telefono =
        document
            .getElementById("registroTelefono")
            .value
            .trim();

    const carrera =
        document
            .getElementById("registroCarrera")
            .value
            .trim();

    const curso =
        document
            .getElementById("registroCurso")
            .value;

    const password =
        document
            .getElementById("registroPassword")
            .value;

    const password2 =
        document
            .getElementById("registroPassword2")
            .value;


    // ==========================================
    // VALIDACIONES
    // ==========================================

    if (password !== password2) {

        mostrarErrorRegistro(
            "Las contraseñas no coinciden."
        );

        return;
    }


    if (!/^\d{7,8}$/.test(dni)) {

        mostrarErrorRegistro(
            "El DNI debe contener 7 u 8 números."
        );

        return;
    }


    // ==========================================
    // ELEMENTOS
    // ==========================================

    const loading =
        document.getElementById(
            "registroLoading"
        );

    const error =
        document.getElementById(
            "registroError"
        );

    const exito =
        document.getElementById(
            "registroExito"
        );

    const boton =
        document.getElementById(
            "btnRegistro"
        );


    loading.style.display = "block";

    error.style.display = "none";

    exito.style.display = "none";

    boton.disabled = true;


    try {

        // ==========================================
        // ENVIAR DATOS A NODE.JS
        // ==========================================

        const respuesta = await fetch(
            "/api/alumnos",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    dni: dni,

                    nombre: nombre,

                    apellido: apellido,

                    email: email,

                    telefono: telefono,

                    carrera: carrera,

                    curso: curso

                })
            }
        );


        const datos =
            await respuesta.json();


        // ==========================================
        // ERROR
        // ==========================================

        if (!respuesta.ok) {

            throw new Error(
                datos.detalle ||
                datos.error ||
                "No se pudo completar el registro."
            );
        }


        // ==========================================
        // REGISTRO CORRECTO
        // ==========================================

        exito.innerHTML = `
            <i class="fa-solid fa-circle-check"></i>
            <strong>Registro realizado correctamente.</strong>
            <br><br>
            Tus datos fueron guardados correctamente.
            <br><br>
            Ahora podés ingresar con tu DNI.
        `;

        exito.style.display = "block";


        // Colocar DNI en login

        document.getElementById(
            "loginDni"
        ).value = dni;


        // Limpiar formulario

        document.getElementById(
            "registroDni"
        ).value = "";

        document.getElementById(
            "registroNombre"
        ).value = "";

        document.getElementById(
            "registroApellido"
        ).value = "";

        document.getElementById(
            "registroEmail"
        ).value = "";

        document.getElementById(
            "registroTelefono"
        ).value = "";

        document.getElementById(
            "registroCarrera"
        ).value = "";

        document.getElementById(
            "registroCurso"
        ).value = "";

        document.getElementById(
            "registroPassword"
        ).value = "";

        document.getElementById(
            "registroPassword2"
        ).value = "";


        // Ir al login

        setTimeout(() => {

            showSection("login");

        }, 2500);


    } catch (error) {

        console.error(
            "Error en registro:",
            error
        );

        mostrarErrorRegistro(
            error.message
        );

    } finally {

        loading.style.display = "none";

        boton.disabled = false;
    }
}


// ==========================================
// MOSTRAR ERROR DE REGISTRO
// ==========================================

function mostrarErrorRegistro(mensaje) {

    const error =
        document.getElementById(
            "registroError"
        );

    error.innerHTML =
        `<i class="fa-solid fa-circle-exclamation"></i>
         ${mensaje}`;

    error.style.display = "block";
}


// ==========================================
// LOGIN
// ==========================================

async function handleLogin(event) {

    event.preventDefault();

    const dni =
        document
            .getElementById("loginDni")
            .value
            .trim();

    const password =
        document
            .getElementById("loginPassword")
            .value;


    const loading =
        document.getElementById(
            "loginLoading"
        );

    const error =
        document.getElementById(
            "loginError"
        );

    const boton =
        document.getElementById(
            "btnLogin"
        );


    loading.style.display = "block";

    error.style.display = "none";

    boton.disabled = true;


    try {

        if (!/^\d{7,8}$/.test(dni)) {

            throw new Error(
                "El DNI debe contener 7 u 8 números."
            );
        }


        if (!password) {

            throw new Error(
                "Ingresá tu contraseña."
            );
        }


        // ==========================================
        // CONSULTAR CUENTA
        // ==========================================

        const respuesta = await fetch(
            `/api/cuenta/${dni}`
        );


        const datos =
            await respuesta.json();


        if (!respuesta.ok) {

            throw new Error(
                datos.error ||
                "No se pudo iniciar sesión."
            );
        }


        // ==========================================
        // MOSTRAR CUENTA
        // ==========================================

        cargarCuenta(datos);


        showSection("cuenta");


    } catch (error) {

        console.error(
            "Error en login:",
            error
        );

        errorMostrarLogin(
            error.message
        );

    } finally {

        loading.style.display = "none";

        boton.disabled = false;
    }
}


// ==========================================
// MOSTRAR ERROR LOGIN
// ==========================================

function errorMostrarLogin(mensaje) {

    const error =
        document.getElementById(
            "loginError"
        );

    error.innerHTML =
        `<i class="fa-solid fa-circle-exclamation"></i>
         ${mensaje}`;

    error.style.display = "block";
}


// ==========================================
// CARGAR CUENTA
// ==========================================

function cargarCuenta(datos) {

    const alumno =
        datos.alumno;

    const cuotas =
        datos.cuotas || [];

    const saldo =
        Number(datos.saldo || 0);


    // ==========================================
    // DATOS PERSONALES
    // ==========================================

    document.getElementById(
        "datosAlumno"
    ).innerHTML = `

        <div class="info-box">
            <strong>DNI</strong>
            ${alumno.dni || "-"}
        </div>

        <div class="info-box">
            <strong>Nombre</strong>
            ${alumno.nombre || "-"}
        </div>

        <div class="info-box">
            <strong>Apellido</strong>
            ${alumno.apellido || "-"}
        </div>

        <div class="info-box">
            <strong>Correo</strong>
            ${alumno.email || "-"}
        </div>

        <div class="info-box">
            <strong>Teléfono</strong>
            ${alumno.telefono || "-"}
        </div>

        <div class="info-box">
            <strong>Carrera</strong>
            ${alumno.carrera || "-"}
        </div>

        <div class="info-box">
            <strong>Curso</strong>
            ${alumno.curso || "-"}
        </div>

    `;


    // ==========================================
    // SALDO
    // ==========================================

    document.getElementById(
        "saldo"
    ).textContent =
        "$" +
        saldo.toLocaleString(
            "es-AR"
        );


    // ==========================================
    // CUOTAS
    // ==========================================

    const tabla =
        document.getElementById(
            "tablaCuotas"
        );


    if (cuotas.length === 0) {

        tabla.innerHTML = `
            <p>
                No hay cuotas registradas.
            </p>
        `;

        return;
    }


    let html = `

        <div style="overflow-x:auto;">

        <table>

            <thead>

                <tr>

                    <th>
                        Concepto
                    </th>

                    <th>
                        Vencimiento
                    </th>

                    <th>
                        Importe
                    </th>

                    <th>
                        Estado
                    </th>

                </tr>

            </thead>

            <tbody>
    `;


    cuotas.forEach(cuota => {

        const importe =
            Number(
                cuota["cuota.importe"] || 0
            );


        const estado =
            cuota.pagado
                ? `
                    <span class="paid">
                        <i class="fa-solid fa-check"></i>
                        Pagado
                    </span>
                `
                : `
                    <span class="pending">
                        <i class="fa-solid fa-clock"></i>
                        Pendiente
                    </span>
                `;


        html += `

            <tr>

                <td>
                    ${cuota.concepto || "-"}
                </td>

                <td>
                    ${cuota.vencimiento || "-"}
                </td>

                <td>
                    $${importe.toLocaleString("es-AR")}
                </td>

                <td>
                    ${estado}
                </td>

            </tr>

        `;

    });


    html += `

            </tbody>

        </table>

        </div>

    `;


    tabla.innerHTML = html;
}

// DESCARGAR RESUMEN
// ==========================================

function descargarResumen() {

    const datos =
        document.getElementById(
            "datosAlumno"
        ).innerText;

    const saldo =
        document.getElementById(
            "saldo"
        ).innerText;

    const cuotas =
        document.getElementById(
            "tablaCuotas"
        ).innerText;


    const texto = `

MI CUENTA ISPI
==============================

DATOS DEL ALUMNO
==============================

${datos}

SALDO PENDIENTE
==============================

${saldo}

CUOTAS
==============================

${cuotas}

==============================
Mi Cuenta ISPI
    `;


    const archivo =
        new Blob(
            [texto],
            {
                type: "text/plain"
            }
        );


    const url =
        URL.createObjectURL(
            archivo
        );


    const enlace =
        document.createElement(
            "a"
        );

    enlace.href = url;

    enlace.download =
        "resumen-mi-cuenta-ispi.txt";

    enlace.click();


    URL.revokeObjectURL(url);
}
